services:
  - type: web
    name: sentineldrive-api
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn render_entry:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: sentineldrive-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SENTINELDRIVE_DB
        value: /var/data/sentineldrive.db
      - key: SENTINELDRIVE_API_KEY
        sync: false
